<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=League+Spartan"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script type="module" src="js/auth/login.js"></script>
  </head>

  <body>
    <div class="loader-container d-none"><div class="dots"></div></div>
    <div class="d-flex justify-content-center align-items-center vh-100">
      <div class="form-container text-center">
        <img
          src="image/Rubenian-Logo-344.png"
          width="100"
          height="100"
          alt="Logo"
        />
        <h1 class="form-title">Membership Portal</h1>
        <p>This is for Authorized Personnel Only.</p>
        <form class="form" id="login_form">
          <label>
            <input
              required
              type="text"
              name="username"
              class="input"
              placeholder=""
            />
            <span>Username</span>
          </label>
          <label>
            <input
              required
              type="password"
              name="password"
              class="input"
              placeholder=""
            />
            <span>Password</span>
          </label>
          <button class="submit" type="submit">Login</button>
        </form>
      </div>
    </div>
    <footer class="text-center text-lg-start">
      <div class="container pb-2">
        <div class="row d-flex justify-content-center">
          <div class="col-md-6 text-md-left text-center">
            <p class="mb-0">
              &copy; 2024 Rubenian Membership Portal. Made with
              <span><i class="fa-solid fa-heart"></i></span> by
              <span>BehindWeb</span>.
            </p>
          </div>
        </div>
      </div>
    </footer>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
