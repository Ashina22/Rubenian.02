<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provinces chapter</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script type="module" src="js/system/filterChapters.js"></script>
  </head>

  <body>
    <div class="wrapper">
      <aside id="sidebar" class="js-sidebar">
        <!-- Content For Sidebar -->
        <div class="h-100">
          <div
            class="sidebar-logo d-flex flex-column align-items-center text-center"
          >
            <img
              src="image/Rubenian-Logo-344.png"
              alt="Logo"
              style="
                width: 50px;
                height: 50px;
                margin-bottom: 5px;
                margin-top: 5px;
              "
            />
            <a href="#">Rubenian</a>
          </div>
          <ul class="sidebar-nav">
            <li class="sidebar-item">
              <a href="index.html" class="sidebar-link">
                <i class="fa-solid fa-home pe-2"></i> Home
              </a>
            </li>
            <li class="sidebar-item">
              <a
                href="masterlist.html?view-master-list"
                class="sidebar-link"
                aria-expanded="false"
              >
                <i class="fa-solid fa-file-lines pe-2"></i> Master List
              </a>
            </li>
            <li class="sidebar-item">
              <div class="d-flex justify-content-between align-items-center">
                <a href="chapters.html" class="sidebar-link">
                  <i class="fa-solid fa-list pe-2"></i> Chapters
                </a>
                <a
                  href="#"
                  class="sidebar-link collapsed"
                  data-bs-target="#posts"
                  data-bs-toggle="collapse"
                  aria-expanded="false"
                >
                </a>
              </div>
              <ul
                id="posts"
                class="sidebar-dropdown list-unstyled collapse"
                data-bs-parent="#sidebar"
              >
                <li class="sidebar-item">
                  <a href="regionalchapter.html" class="sidebar-link"
                    >Regional Chapter</a
                  >
                </li>
                <li class="sidebar-item">
                  <a href="provinces.html" class="sidebar-link"
                    >Province Chapter</a
                  >
                </li>
                <li class="sidebar-item">
                  <a href="municipalities.html" class="sidebar-link"
                    >Municipal Chapter</a
                  >
                </li>
                <li class="sidebar-item">
                  <a href="barangay.html" class="sidebar-link"
                    >Barangay Chapter</a
                  >
                </li>
              </ul>
            </li>

            <li class="sidebar-item">
              <div class="d-flex justify-content-between align-items-center">
                <a href="viewusers.html" class="sidebar-link">
                  <i class="fa-solid fa-users pe-2"></i>Users
                </a>
                <a
                  href="#"
                  class="sidebar-link collapsed"
                  data-bs-target="#users"
                  data-bs-toggle="collapse"
                  aria-expanded="false"
                >
                </a>
              </div>
              <ul
                id="users"
                class="sidebar-dropdown list-unstyled collapse"
                data-bs-parent="#sidebar"
              >
                <li class="sidebar-item">
                  <a href="createusers.html" class="sidebar-link"
                    >Create User</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </aside>

      <div class="main">
        <nav class="navbar navbar-expand-lg px-3 border-bottom">
          <div
            class="collapse navbar-collapse d-flex justify-content-between align-items-center w-100"
          >
            <button class="btn" id="sidebar-toggle" type="button">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="d-flex mx-auto w-50" role="search">
              <input
                class="form-control me-2 search-province"
                type="search"
                placeholder="Search provinces"
                aria-label="Search"
              />
              <button class="btn search-btn" type="submit">
                <i class="fa-solid fa-search"></i>
              </button>
            </div>
            <!-- Profile Dropdown -->
            <ul class="navbar-nav">
              <li class="nav-item dropdown">
                <a href="#" data-bs-toggle="dropdown" class="nav-icon pe-md-0">
                  <img
                    src="image/profile.jpg"
                    class="avatar img-fluid rounded"
                    alt=""
                  />
                </a>
                <div class="dropdown-menu dropdown-menu-end">
                  <a href="#" class="dropdown-item">Profile</a>
                  <a href="#" class="dropdown-item">Setting</a>
                  <a href="login.html" class="dropdown-item">Logout</a>
                </div>
              </li>
            </ul>
          </div>
        </nav>

        <!--main content-->

        <main class="content px-lg-3 py-2">
          <div class="container-fluid">
            <h2 class="text-center my-4">Province Chapter</h2>
            <div class="d-flex justify-content-end">
              <button
                class="btn btn-add"
                data-bs-toggle="modal"
                data-bs-target="#addChapterModal"
              >
                <i class="fas fa-plus"></i> Add Province
              </button>
            </div>
          </div>
          <div class="container">
            <div class="btn-container" id="provinceContainer"></div>
          </div>
        </main>

        <!-- Add Chapter Modal -->
        <div
          class="modal fade modal-sm"
          id="addChapterModal"
          tabindex="-1"
          aria-labelledby="addChapterModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title text-white" id="addChapterModalLabel">
                  Add Province
                </h5>
              </div>
              <div class="modal-body">
                <form id="addChapterForm">
                  <div class="mb-3">
                    <label for="chapterName" class="form-label"
                      >Chapter Name</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="chapterName"
                      placeholder="e.g. NCR, Region IV"
                    />
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancel
                </button>
                <button
                  type="button"
                  class="btn btn-add-chapter"
                  id="saveChapter"
                >
                  Add
                </button>
              </div>
            </div>
          </div>
        </div>

        <a href="#" class="theme-toggle">
          <i class="fa-regular fa-moon"></i>
          <i class="fa-regular fa-sun"></i>
        </a>
        <footer class="text-center text-lg-start">
          <div class="container pb-2">
            <div class="row d-flex justify-content-center">
              <div class="col-md-6 text-md-left text-center">
                <p class="mb-0">
                  &copy; 2024 Rubenian Membership Portal. Made with
                  <span><i class="fa-solid fa-heart"></i></span> by
                  <span>BehindWeb</span>.
                </p>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
